apiVersion: apps/v1
kind: Deployment
metadata:
  name: trident-deployment  
spec:
  replicas: 1
  selector:
    matchLabels: 
      component: trident-web
  template:
    metadata:
      labels:
        component: trident-web
    spec:
      containers:
        - name: trident-web
          image: bobjwalker99/trident:{{ .Values.standard.image.tag }}          
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          imagePullPolicy: "Always"
          ports:
           - containerPort: 8080
             name: http-port
          env:
           - name: TRIDENT_CONNECTION_STRING
             valueFrom:
               secretKeyRef:
                 name: trident-credentials
                 key: connectionString  
           - name: TRIDENT_SUMOLOGIC_URL
             valueFrom:
               secretKeyRef:
                 name: trident-credentials
                 key: sumoLogicUrl
           - name: TRIDENT_OPEN_FEATURE_CLIENT_ID
             valueFrom:
               secretKeyRef:
                 name: trident-credentials
                 key: openFeatureClientId       
           - name: TRIDENT_FILE_NAME
             value: {{ .Values.trident.configurationFileName }}
           - name: TRIDENT_ENVIRONMENT
             value: {{ .Values.standard.environmentName }}           
---
apiVersion: v1
kind: Service
metadata:
  name: trident-app-cluster-ip-service  
spec:
  type: ClusterIP
  selector:
    component: trident-web
  ports:
    - port: 6800
      targetPort: 8080  
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trident-ingress-http-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: public-gateway
    namespace: traefik
  hostnames:
    - {{ .Values.standard.networking.hostName }}
  rules:
    - backendRefs:
        - name: trident-app-cluster-ip-service  
          port: 6800 