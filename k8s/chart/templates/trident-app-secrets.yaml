apiVersion: v1
kind: Secret
metadata:
  name: trident-credentials
  annotations:
    application-name: "Trident"
    component: "Secrets for various environment variables"
type: Opaque
stringData:
  connectionString: {{ .Values.standard.secrets.connectionString }}
  sumoLogicUrl: {{ .Values.standard.secrets.sumologicUrl }}
  openFeatureClientId: {{ .Values.standard.secrets.openFeatureClientId }}